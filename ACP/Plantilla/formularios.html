<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios Dinámicos</title>
    <!-- Estilos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Mis estilos personalizados -->
    <link rel="stylesheet" href="assets/css/generic.css">
</head>
<body class="min-vh-100 d-flex flex-column">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <span class="menu-icon"></span>
            <a class="navbar-brand" href="#">PlantillaWeb</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="lateral.html">Lateral</a></li>
<li class="nav-item"><a class="nav-link" href="triple.html">Triple</a></li>
<li class="nav-item"><a class="nav-link" href="periodico.html">Periódico</a></li>
<li class="nav-item"><a class="nav-link active" aria-current="page">Formularios</a></li>

                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container my-5 flex-grow-1">
        <h1 class="mb-4">Formularios</h1>
        <ul class="nav nav-tabs" id="formulariosTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="registro-tab" data-bs-toggle="tab" data-bs-target="#registro" type="button" role="tab">Registro</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="contacto-tab" data-bs-toggle="tab" data-bs-target="#contacto" type="button" role="tab">Contacto</button>
            </li>
        </ul>
        <div class="tab-content" id="formulariosTabsContent">
            <!-- Pestaña Registro -->
            <div class="tab-pane fade show active p-4 border border-top-0 bg-light rounded-bottom" id="registro" role="tabpanel">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" placeholder="Escribe tu usuario">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" placeholder="Escribe tu contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </form>
            </div>
            <!-- Pestaña Contacto -->
            <div class="tab-pane fade p-4 border border-top-0 bg-light rounded-bottom" id="contacto" role="tabpanel">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="tu@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea class="form-control" rows="3" placeholder="Escribe tu mensaje..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Librería JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Mi script JS -->
    <script src="assets/js/master.js"></script>
</body>
</html>
